name = "積分の演習"
desc = "定積分・不定積分の大問演習。東大の大問 1 題分の重さで、高校数学の範囲で解けて思考力を鍛える問題（解答・解説付き）"
order = 10
category = "数学の演習"
keyword = "積分の演習問題"
tags = "積分, 定積分, 不定積分, 数学III, 演習問題, 思考力, 解答・解説"
intro = """
高校数学（数学Ⅲまで）の範囲で解けるが、公式に当てはめるだけでは解けない積分の問題を、**東大の大問 1 題分（25〜40 分）の重さ**で集めました。東大 2025 年度 理科 第2問（不等式ではさんで積分の極限を求める問題）と同じかそれ以上の難しさです。難しい問題に挑戦する体力と頭脳のある人向けです。

- 複素数の積分、重積分（フビニの定理）、級数展開、パラメータで微分する方法などは**使いません**。置換積分・部分積分・対称性・漸化式・不等式だけで解けます。
- 答えに逆三角関数（$\\tan^{-1}$）が必要な問題は入れていません。$\\pi$ が出る問題は $x=\\tan\\theta$ の置換で処理できます。
- すべての問題に、答え・筋道（骨子）・ねらいの解説があります。答えは Python で検算しています（定積分は数値積分、不定積分は答えを微分して確かめました）。
"""

