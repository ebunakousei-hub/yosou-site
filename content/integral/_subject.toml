intro = """
高校数学（数学Ⅲまで）の範囲で解けるが、公式に当てはめるだけでは解けない積分の問題を集めました。難しい問題に挑戦する体力と頭脳のある人向けです。

- 複素数の積分、重積分（フビニの定理）、級数展開、パラメータで微分する方法などは**使いません**。置換積分・部分積分・対称性・漸化式・不等式だけで解けます。
- 答えに逆三角関数（$\\tan^{-1}$）が必要な問題は入れていません。$\\pi$ が出る問題は $x=\\tan\\theta$ の置換で処理できます。
- すべての問題に、答え・筋道（骨子）・ねらいの解説があります。答えは Python で検算しています（定積分は数値積分、不定積分は答えを微分して確かめました）。
"""

